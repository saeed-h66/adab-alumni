<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | ادب</title><style>@font-face{font-family:Vazirmatn;src:url('Vazirmatn-Regular.ttf')}@font-face{font-family:Vazirmatn;src:url('Vazirmatn-Bold.ttf');font-weight:700}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef8f8;color:#17324d;font-family:Vazirmatn,Tahoma,sans-serif}.card{width:min(92%,430px);padding:34px;border:1px solid #dcebed;border-radius:24px;background:#fff;box-shadow:0 20px 55px #27545d18}.brand{text-align:center}.brand img{width:76px;height:76px;padding:8px;border-radius:20px;box-shadow:0 5px 20px #00505a18}.brand h1{margin:15px 0 4px;font-size:24px}.brand p{margin:0;color:#71818a;font-size:12px}.field{margin-top:22px}.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.field input{width:100%;height:48px;padding:0 13px;border:1px solid #dce7e8;border-radius:11px;font:inherit;outline:0}.field input:focus{border-color:#0099a7;box-shadow:0 0 0 4px #0099a71a}.submit{width:100%;height:48px;margin-top:22px;border:0;border-radius:11px;color:#fff;background:#0099a7;font:inherit;font-weight:700;cursor:pointer}.message{min-height:24px;margin-top:15px;color:#b36b1d;text-align:center;font-size:12px}</style></head><body><main class="card"><div class="brand"><img src="لوگو.svg" alt="لوگوی بعثت"><h1>ورود مدیریت ادب</h1><p>مدیریت اعضا، رویدادها و محتوای انجمن</p></div><form onsubmit="login(event)"><div class="field"><label for="user">نام کاربری</label><input id="user" required autocomplete="username"></div><div class="field"><label for="pass">رمز عبور</label><input id="pass" type="password" required autocomplete="current-password"></div><button class="submit" type="submit">ورود به پنل مدیریت</button><div class="message" id="message"></div></form></main><script>function login(e){e.preventDefault();localStorage.setItem('adab_admin_session','demo');location.href='admin.html';}</script></body></html>
